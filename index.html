<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var isLocalPreview = ["localhost", "127.0.0.1"].indexOf(window.location.hostname) !== -1;
        if (!isLocalPreview) return;

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then(function (registrations) {
              registrations.forEach(function (registration) {
                registration.unregister();
              });
            })
            .catch(function () {});
        }

        if (window.caches) {
          window.caches
            .keys()
            .then(function (keys) {
              keys.forEach(function (key) {
                window.caches.delete(key);
              });
            })
            .catch(function () {});
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mero Pasal</title>
    <link rel="shortcut icon" href="/favicon.ico?v=mero-pasal" />
    <link rel="icon" type="image/png" href="/logo.png?v=mero-pasal" />
    <meta name="description" content="Cafe & Inventory Management System for your business" />
    <meta name="author" content="Mero Pasal" />

    <!-- PWA / Mobile -->

  </head>

</html>
